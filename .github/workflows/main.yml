name: main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "16.2"
            ios: "18.2"
            device: "iPhone 16"
          - xcode: "26.0"
            ios: "26.0"
            device: "iPhone 16"

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode ${{ matrix.xcode }}
      run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

    - name: Show Xcode and Swift version
      run: |
        xcodebuild -version
        swift --version

    - name: List available simulators
      run: xcrun simctl list devices available

    - name: Build and Test on iOS ${{ matrix.ios }}
      run: |
        xcodebuild test \
          -scheme Atlantis \
          -destination "platform=iOS Simulator,name=${{ matrix.device }},OS=${{ matrix.ios }}" \
          -skipPackagePluginValidation \
          -skipMacroValidation \
          | xcpretty --color || exit ${PIPESTATUS[0]}